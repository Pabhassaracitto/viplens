name: Flutter Checks

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - test/backup_codec_test.dart
          - test/database_service_test.dart
          - test/text_parser_service_test.dart
          - test/notification_navigation_test.dart
    name: Test ${{ matrix.test_file }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Run test file
        run: flutter test ${{ matrix.test_file }} --reporter=expanded
