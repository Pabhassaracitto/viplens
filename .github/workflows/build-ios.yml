name: Build iOS Simulator

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS Simulator app
        run: |
          flutter build ios --release --simulator
          cd build/ios/iphonesimulator
          zip -r app-release-simulator.zip Runner.app

      - name: Upload iOS Simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: viplens-ios-simulator-${{ github.ref_name }}
          path: build/ios/iphonesimulator/app-release-simulator.zip
          if-no-files-found: error
